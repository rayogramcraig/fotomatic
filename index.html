<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fotomatic prototype</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#202124}body{display:grid;place-items:center;overflow:hidden}.phone{position:relative;width:min(932px,100vw,calc(100dvh * 932 / 550));aspect-ratio:932/550;overflow:hidden;box-shadow:0 12px 60px #0007}img{width:100%;height:100%;display:block}.hotspot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;color:transparent}.hotspot:focus-visible{outline:3px dashed white;outline-offset:-4px;background:#ffffff22}.hotspot.checked:after{content:'✓';color:#263849;font:bold 20px sans-serif;position:absolute;left:0;top:0}.hint{position:fixed;bottom:8px;right:12px;color:#aaa;font:12px system-ui}dialog{border:0;border-radius:8px;max-width:340px;padding:24px;font:16px system-ui}dialog::backdrop{background:#0008}dialog button{padding:8px 14px;margin-top:12px} @media(max-height:600px){.hint{display:none}}
</style></head><body><main class="phone" aria-label="Fotomatic clickable prototype"><img id="screen" alt=""><div id="links"></div></main><div class="hint">Esc: home · ← / →: pictures · browser Back: previous screen</div><dialog id="notice"><p id="message"></p><button onclick="notice.close()">Return to print</button></dialog><script>
const names=['Camera','Viewfinder','Completed film','Processing options','Drop-off confirmation','Envelopes','Prints','Back of print','Next print'];
const img=document.querySelector('#screen'),links=document.querySelector('#links');let screen=1;const choices=new Set();
function go(n){location.hash='screen-'+n}function spot(label,x,y,w,h,action,checked=false){const b=document.createElement('button');b.className='hotspot'+(checked?' checked':'');b.setAttribute('aria-label',label);b.title=label;Object.assign(b.style,{left:x/932*100+'%',top:y/550*100+'%',width:w/932*100+'%',height:h/550*100+'%'});b.onclick=action;links.append(b)}
function show(){screen=Math.max(1,Math.min(9,Number(location.hash.replace('#screen-',''))||1));img.src='assets/'+screen+'.png';img.alt=names[screen-1];links.replaceChildren();const to=(l,x,y,w,h,n)=>spot(l,x,y,w,h,()=>go(n));
if(screen===1){to('Open camera',310,235,255,265,2);to('Pick up finished film',0,340,150,95,6);to('Open pictures received',0,440,150,100,6)}
if(screen===2){to('Take picture and finish test roll',48,25,710,490,3);to('Shutter: finish test roll',760,155,150,230,3);to('Return to camera',755,0,170,145,1)}
if(screen===3){to('Drop off film for processing',222,143,477,140,4);to('Return to camera',35,315,160,190,1)}
if(screen===4){['Borderless prints','Normal prints','Slides'].forEach((l,i)=>spot(l,235,192+i*63,420,45,()=>{choices.clear();choices.add(i);show()},choices.has(i)));to('Submit film',187,382,520,74,5);to('Cancel drop-off',0,0,180,550,3)}
if(screen===5){to('Complete drop-off and return to camera',187,382,520,74,1);to('Return to camera',187,65,520,317,1)}
if(screen===6){to('Open front envelope',230,40,702,460,7);to('Open another envelope',0,50,230,450,9);to('Return to camera',0,0,932,38,1)}
if(screen===7||screen===9){to('Return to envelopes',0,0,110,550,6);to('Flip picture to see options',220,75,555,410,8);to('Next picture',775,0,157,550,screen===7?9:7);to('Previous picture',110,0,110,550,screen===7?9:7)}
if(screen===8){to('Flip back to picture',285,80,520,110,7);['Share this picture','Order more prints','Crop or fix exposure'].forEach((l,i)=>spot(l,399,190+i*63,380,50,()=>{document.querySelector('#message').textContent=l+' — this action is a placeholder in the screen prototype.';document.querySelector('#notice').showModal()}));to('Return to envelopes',0,0,115,550,6);to('Flip back to picture',285,390,520,80,7)}
}
window.addEventListener('hashchange',show);window.addEventListener('keydown',e=>{if(document.querySelector('dialog').open)return;if(e.key==='Escape')go(1);if((screen===7||screen===9)&&['ArrowLeft','ArrowRight'].includes(e.key))go(screen===7?9:7)});let start;document.querySelector('.phone').addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});document.querySelector('.phone').addEventListener('touchend',e=>{if((screen===7||screen===9)&&Math.abs(e.changedTouches[0].clientX-start)>50)go(screen===7?9:7)},{passive:true});show();
</script></body></html>
